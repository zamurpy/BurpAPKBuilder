name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
          
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          
      - name: Build with Gradle
        env:
          PROJECT_SRC: ${{ github.workspace }}/BurpSuiteAndroid
          BUILD_DIR: ${{ github.workspace }}/BurpAndroidAPK
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        run: python3 gagah.py
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk
          path: BurpAndroidAPK/app/build/outputs/apk/debug/app-debug.apk
